<header><h1>Photosynthesis in Higher Plants</h1><p class="sub">Class 11 CBSE Biology · Chapter 11 (NCERT) · simple English, full exam prep</p></header>
<nav id="nav" aria-label="Sections"></nav><main id="v"></main>
<script>
const $=s=>document.querySelector(s);
const D=(t,b,c='')=>`<details class="c ${c}"><summary>${t}</summary>${b}</details>`;
const C=(b,c='')=>`<div class="c ${c}">${b}</div>`;
const FL=a=>`<div class="fl">${a.map(x=>`<div>${x}</div>`).join('')}</div>`;

const LEARN=[
D('1. What is photosynthesis?',`<p>Plants make their own food using <b>light, CO₂ and water</b>. This is the only natural process that brings energy from the Sun into living things. It also releases the O₂ we breathe.</p><div class="eq">6CO₂ + 12H₂O → C₆H₁₂O₆ + 6H₂O + 6O₂</div><p>Chemically it is a <b>redox reaction</b>: water is oxidised (loses electrons, releases O₂) and CO₂ is reduced (gains electrons, becomes sugar).</p><h3>Key experiments</h3><ul><li><b>Priestley (1770):</b> plants "restore" air spoiled by a burning candle or a mouse.</li><li><b>Ingenhousz:</b> only the <b>green parts in sunlight</b> do this.</li><li><b>Sachs:</b> glucose is made and stored as <b>starch</b> in green parts.</li><li><b>T.W. Engelmann:</b> split light with a prism on <i>Cladophora</i>; aerobic bacteria gathered at <b>blue and red</b> light = those work best.</li><li><b>Cornelius van Niel:</b> in purple sulphur bacteria, H₂S gives sulphur, so the H donor is the "H₂A". In plants it is H₂O.</li><li><b>Ruben &amp; Kamen (¹⁸O):</b> the O₂ released comes from <b>water, not CO₂</b>.</li></ul>`),
D('2. Where does it happen?',`<p>In the <b>chloroplast</b> of leaf mesophyll cells.</p><ul><li><b>Grana (thylakoid stacks):</b> light reactions. Pigments sit in the thylakoid membrane.</li><li><b>Stroma:</b> dark/biosynthetic reactions (Calvin cycle), because enzymes are here.</li></ul><p>Think: <b>grana = solar panel</b>, <b>stroma = sugar factory</b>.</p>`,'s'),
D('3. Pigments: who catches the light?',`<table><tr><th>Pigment</th><th>Colour</th></tr><tr><td>Chlorophyll a</td><td>Bright / blue-green</td></tr><tr><td>Chlorophyll b</td><td>Yellow-green</td></tr><tr><td>Xanthophylls</td><td>Yellow</td></tr><tr><td>Carotenoids</td><td>Yellow to orange</td></tr></table><ul><li><b>Chl a</b> is the main pigment. <b>b, xanthophylls, carotenoids</b> are accessory: they pass energy to chl a and protect it from strong light.</li><li><b>Absorption spectrum:</b> how much light each colour is absorbed (peaks in blue and red).</li><li><b>Action spectrum:</b> how much photosynthesis happens at each colour. They match closely.</li><li>Chromatography of leaf extract (top to bottom): carotene, xanthophyll, chl a, chl b.</li></ul>`,'k'),
D('4. Light reaction (in grana)',`<p>Light hits two photosystems: <b>PS II (P680)</b> and <b>PS I (P700)</b>. Each has a reaction centre plus light-harvesting complexes (LHC).</p><h3>Non-cyclic photophosphorylation (Z-scheme)</h3><ul><li>PS II excited, electrons leave P680, travel via <b>Pheo, QA, PQ, Cyt b6f, PC</b> to PS I.</li><li>Lost electrons in PS II are refilled by <b>splitting of water (photolysis)</b> on the <b>lumen side</b>: 2H₂O → 4H⁺ + O₂ + 4e⁻ (needs Mn, Ca²⁺, Cl⁻).</li><li>PS I excited by light, electrons go via <b>Fd</b> to <b>NADP reductase</b>: NADP⁺ + 2e⁻ + H⁺ → <b>NADPH</b>.</li></ul><h3>Cyclic photophosphorylation</h3><p>Only PS I works. Electrons return to PS I. Makes <b>only ATP</b>. No NADPH, no O₂. Occurs in stroma lamellae.</p><h3>Chemiosmosis: how ATP is made</h3><ul><li>H⁺ pile up inside the lumen (from water splitting + PQ pumping + NADP reduction taking H⁺ from stroma).</li><li>H⁺ rush back through <b>ATP synthase (CF₀–CF₁)</b> and energy makes ATP.</li></ul>`,'o'),
D('5. Calvin cycle (dark reaction, in stroma)',`<p>Needs ATP + NADPH from light reaction. It works in <b>all</b> photosynthesisers, even C4 plants. Discovered by <b>Melvin Calvin</b>.</p><ul><li><b>1. Carboxylation:</b> CO₂ + RuBP (5C) → 2 × 3-PGA (3C), by <b>RuBisCO</b> (the most abundant enzyme on Earth).</li><li><b>2. Reduction:</b> 3-PGA → PGAL (sugar), using 2 ATP + 2 NADPH per CO₂.</li><li><b>3. Regeneration:</b> RuBP is rebuilt, using 1 ATP.</li></ul><p>Per CO₂: <b>3 ATP + 2 NADPH</b>. For 1 glucose (6 CO₂, 6 turns): <b>18 ATP + 12 NADPH</b>.</p>`),
D('6. C4 pathway (Hatch &amp; Slack)',`<p>Plants like <b>maize, sugarcane, sorghum</b> have <b>Kranz anatomy</b>: large bundle sheath cells around veins with big chloroplasts.</p><ul><li>In <b>mesophyll</b>: CO₂ + PEP (3C) → <b>OAA (4C)</b> by <b>PEPcase</b> (no oxygenase activity, so no waste).</li><li>OAA → malic/aspartic acid, moves to <b>bundle sheath</b>.</li><li>There it releases CO₂ → Calvin cycle (C3). A 3C pyruvate returns to mesophyll, becomes PEP using <b>2 ATP</b>.</li></ul><p>Cost: <b>5 ATP + 2 NADPH per CO₂</b>, but no photorespiration, so more yield in heat and bright light.</p>`,'v'),
D('7. Photorespiration',`<p>RuBisCO can grab <b>O₂</b> instead of CO₂ when CO₂ is low and O₂ is high. RuBP + O₂ → one 3-PGA + one 2C phosphoglycolate.</p><ul><li>Path: <b>chloroplast → peroxisome → mitochondria</b>.</li><li>No ATP or NADPH made. It <b>wastes energy</b> and releases CO₂.</li><li>C3 plants lose a lot; <b>C4 plants have almost none</b>.</li></ul>`,'o'),
D('8. Factors affecting photosynthesis',`<p><b>Blackman's Law of Limiting Factors:</b> if several factors control a process, the rate is set by the one nearest its minimum value.</p><ul><li><b>Light:</b> rate rises with intensity, then saturates (about 10% of full sunlight is enough for most plants). Too strong light damages chlorophyll.</li><li><b>CO₂:</b> the major limiting factor. C3 saturates near 450 µL/L, C4 near 360 µL/L. Higher CO₂ boosts only C3.</li><li><b>Temperature:</b> C4 optimum is higher than C3 (enzymes).</li><li><b>Water:</b> stress closes stomata (less CO₂) and wilts leaves.</li></ul>`,'s')];

const Z=`<div class="c"><h3>Z-scheme (draw this in exams)</h3><svg class="dg" viewBox="0 0 360 230" role="img" aria-label="Z scheme of light reaction"><text x="4" y="12">Redox potential ↑ (more negative)</text><path d="M30 190 L60 165 L82 55 L145 105 L190 125 L205 130 L232 35 L285 62 L335 78" fill="none" stroke="#b8f23a" stroke-width="3"/><path d="M82 55 L60 165 M232 35 L205 130" stroke="#ffc933" stroke-width="3" stroke-dasharray="5 4"/><circle cx="60" cy="165" r="5" fill="#3dd6ff"/><circle cx="205" cy="130" r="5" fill="#3dd6ff"/><text x="2" y="205">H₂O → ½O₂ + 2H⁺ (lumen)</text><text x="38" y="158">P680</text><text x="88" y="52">P680*</text><text x="120" y="100">Pheo, QA</text><text x="108" y="150">PQ → Cyt b6f → PC</text><text x="108" y="163" fill="#ff6b57">(H⁺ pumped → ATP)</text><text x="212" y="144">P700</text><text x="238" y="32">P700*</text><text x="262" y="55">Fd</text><text x="270" y="95" fill="#ff6b57">NADP⁺ → NADPH</text><text x="64" y="115" fill="#ffc933">light</text><text x="210" y="85" fill="#ffc933">light</text></svg></div>`;

const FLOWS=[C('<h2>Flowcharts</h2><p class="ex">Tap through each one mentally, then redraw it on paper without looking.</p>','v'),
C('<h3>Light reaction (non-cyclic)</h3>'+FL(['Light hits PS II (P680)','e⁻ excited → Pheo → QA → PQ → Cyt b6f → PC','Water splits at lumen: O₂ + H⁺ + e⁻ refill PS II','H⁺ gradient → ATP synthase → <b>ATP</b>','PS I (P700) excited → Fd → NADP reductase','<b>NADPH</b> made']),'o'),
C('<h3>Calvin cycle</h3>'+FL(['CO₂ + RuBP (5C)','<b>RuBisCO</b> → 2 × 3-PGA (3C)','Reduction: 2 ATP + 2 NADPH → PGAL','5 of every 6 PGAL → RuBP regenerated (1 ATP)','1 of every 6 PGAL → glucose, starch, etc.'])),
C('<h3>C4 pathway</h3>'+FL(['Mesophyll: PEP + CO₂ → OAA (PEPcase)','OAA → malate / aspartate','Transported to bundle sheath','Decarboxylation → CO₂ + pyruvate','CO₂ enters Calvin cycle, pyruvate returns (2 ATP → PEP)']),'v'),
C('<h3>Photorespiration</h3>'+FL(['Chloroplast: RuBP + O₂ → PGA + phosphoglycolate','Peroxisome: glycolate → glycine','Mitochondria: 2 glycine → serine + CO₂','Serine returns to chloroplast, no sugar, no ATP gained']),'s')];

const MN=[C('<h2>Mnemonics</h2>','s'),
C('<p class="m"><i>C</i>arrots e<i>X</i>cite <i>A</i>nnie\'s <i>B</i>rain</p>Chromatography order, top to bottom: <b>C</b>arotene, <b>X</b>anthophyll, chl <b>A</b>, chl <b>B</b>.'),
C('<p class="m"><i>II</i> comes <i>first</i>, I comes second</p>PS II (P680) works <b>before</b> PS I (P700), even though 680 &lt; 700.','o'),
C('<p class="m"><i>C</i>ats <i>R</i>un <i>R</i>ound</p>Calvin phases: <b>C</b>arboxylation, <b>R</b>eduction, <b>R</b>egeneration.','k'),
C('<p class="m"><i>M</i>any <i>C</i>ats <i>C</i>ry</p>Water splitting needs <b>M</b>n, <b>C</b>a²⁺, <b>C</b>l⁻.','v'),
C('<p class="m"><i>C</i>ute <i>P</i>andas <i>M</i>unch</p>Photorespiration: <b>C</b>hloroplast → <b>P</b>eroxisome → <b>M</b>itochondria.'),
C('<p class="m"><i>3-2</i> for C3, <i>5-2</i> for C4</p>ATP-NADPH per CO₂: C3 uses 3 ATP + 2 NADPH, C4 uses 5 ATP + 2 NADPH.','s'),
C('<p class="m"><i>Mesophyll Makes, Sheath Spends</i></p>C4: mesophyll fixes CO₂ into OAA, bundle sheath releases it for Calvin.','o')];

const FACTS=[C('<h2>Facts, tips &amp; hacks</h2>','k'),
C('<h3>Facts that become 1-mark questions</h3><ul><li>RuBisCO = most abundant enzyme on Earth. It is both carboxylase and oxygenase.</li><li>Chlorophyll has a porphyrin head with <b>Mg²⁺</b> and a phytol tail.</li><li>C4 plants: low CO₂ compensation point (0–10 ppm) vs C3 (25–100 ppm).</li><li>C3 temperature optimum 20–25 °C; C4 30–45 °C.</li><li>Photosynthesis happens in <b>stroma</b> (dark) and <b>grana</b> (light).</li><li>Cyclic photophosphorylation: <b>only ATP</b>, no O₂, no NADPH.</li><li>Dark reaction is not "in the dark": it just doesn\'t need light directly.</li></ul>','s'),
C('<h3>Exam hacks</h3><ul><li><b>Z-scheme:</b> always label y-axis "redox potential", mark both photosystems, e⁻ arrows, ATP and NADPH. That alone earns most marks.</li><li><b>Compare C3 vs C4 in a table.</b> Examiners love tables for 3-5 mark answers.</li><li>Write equations with <b>enzyme names above arrows</b>.</li><li>Remember numbers in pairs: 3 &amp; 2, 18 &amp; 12, 5 &amp; 2.</li><li>If asked "why C4 yields more", say: <b>no photorespiration, PEPcase has high CO₂ affinity, Kranz anatomy concentrates CO₂</b>.</li><li>Learn Chlorophyll a vs b difference: a is the main, bright blue-green; b is accessory.</li></ul>'),
C('<h3>C3 vs C4 at a glance</h3><div class="w"><table><tr><th></th><th>C3</th><th>C4</th></tr><tr><td>First product</td><td>3-PGA</td><td>OAA</td></tr><tr><td>Anatomy</td><td>Normal</td><td>Kranz</td></tr><tr><td>Enzyme</td><td>RuBisCO</td><td>PEPcase, then RuBisCO</td></tr><tr><td>Photorespiration</td><td>Yes</td><td>Almost none</td></tr><tr><td>ATP:NADPH per CO₂</td><td>3:2</td><td>5:2</td></tr><tr><td>Examples</td><td>Wheat, rice</td><td>Maize, sugarcane</td></tr></table></div>','v'),Z];

const REAL=[C('<h2>Real-life links</h2>','o'),
C('<h3>Why are autumn leaves yellow?</h3>Chlorophyll breaks down first. Carotenoids and xanthophylls were always there, hidden under green. Now you see them.'),
C('<h3>Sugarcane in hot summer, wheat in cool winter</h3>Sugarcane and maize are <b>C4</b>: they love heat and bright sun. Wheat and rice are <b>C3</b>: they grow best in cooler weather. This is why farmers sow them in different seasons.','s'),
C('<h3>Bubbles from Hydrilla in an aquarium</h3>Those bubbles are O₂ from water splitting. Put the plant in light and they appear faster; in the dark they slow down (Priestley / Ingenhousz idea).','k'),
C('<h3>CO₂ enrichment in greenhouses</h3>Tomato and bell pepper growers pump extra CO₂ (up to about 2000 µL/L) to raise yield. This works because CO₂ is a limiting factor for C3 plants.','v'),
C('<h3>Why do plants kept in dim rooms grow weak?</h3>Light is the limiting factor (Blackman). With too little light, even enough water and CO₂ cannot help.'),
C('<h3>Problem to try</h3>A student gives a plant extra water, CO₂ and fertiliser, but keeps it in shade. Photosynthesis barely rises. Which factor is limiting? <b>Light.</b>','o')];

const Q=[
['Which gas released in photosynthesis comes from water?',['CO₂','O₂','H₂','N₂'],1,'Ruben &amp; Kamen with ¹⁸O showed O₂ comes from H₂O.'],
['The main pigment of photosynthesis is',['Chlorophyll a','Chlorophyll b','Xanthophyll','Carotene'],0,'Chl a is the primary pigment; others are accessory.'],
['Reaction centre of PS II absorbs best at',['700 nm','680 nm','640 nm','750 nm'],1,'P680 = PS II, P700 = PS I.'],
['First stable product of the C3 cycle is',['OAA','PGAL','3-PGA','RuBP'],2,'RuBP + CO₂ → 2 × 3-PGA.'],
['First stable product of the C4 pathway is',['3-PGA','OAA','Pyruvate','PEP'],1,'PEP + CO₂ → OAA (4C).'],
['Enzyme for CO₂ fixation in the Calvin cycle',['PEPcase','ATP synthase','RuBisCO','Hexokinase'],2,'RuBisCO, also an oxygenase.'],
['Kranz anatomy is found in',['Wheat','Rice','Maize','Pea'],2,'Maize and sugarcane are C4 plants.'],
['ATP + NADPH used per CO₂ in the Calvin cycle',['2 ATP, 3 NADPH','3 ATP, 2 NADPH','5 ATP, 2 NADPH','1 ATP, 1 NADPH'],1,'C3 = 3 ATP + 2 NADPH. C4 = 5 ATP + 2 NADPH.'],
['Photorespiration involves which organelles?',['Chloroplast, peroxisome, mitochondria','Nucleus, ER, Golgi','Chloroplast only','Ribosome, vacuole'],0,'C → P → M.'],
['Cyclic photophosphorylation produces',['ATP and NADPH','NADPH only','ATP only','O₂ and ATP'],2,'Only PS I is involved; no NADPH, no O₂.'],
['Water splitting occurs on the ___ side of PS II',['Stroma','Lumen','Outer membrane','Cytoplasm'],1,'In the thylakoid lumen: H⁺ are released there.'],
['Blackman\'s law says the rate is controlled by the',['Factor in excess','Factor nearest minimum','Temperature only','Light only'],1,'The limiting factor decides the rate.']];
let sc=0,dn=0;
function TEST(){sc=0;dn=0;return`<h2>Mock test · 12 MCQs</h2><div class="sc" id="sc">Score 0 / 12</div>`+Q.map((q,i)=>C(`<b>Q${i+1}.</b> ${q[0]}<div class="o4">${q[1].map((o,j)=>`<button data-q="${i}" data-o="${j}">${o}</button>`).join('')}</div><div class="ex" id="e${i}"></div>`,'v')).join('')+'<button class="btn" id="rs">Restart test</button>'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(b&&!b.parentNode.dataset.d){const i=+b.dataset.q,o=+b.dataset.o,q=Q[i];b.parentNode.dataset.d=1;dn++;[...b.parentNode.children].forEach((x,j)=>{if(j==q[2])x.classList.add('ok')});if(o==q[2])sc++;else b.classList.add('no');$('#e'+i).innerHTML=(o==q[2]?'✅ Correct. ':'❌ Not quite. ')+q[3];$('#sc').textContent=`Score ${sc} / 12`+(dn==12?(sc>=10?' · Excellent!':sc>=7?' · Good, revise weak spots':' · Re-read Learn and retry'):'');if(dn==12)try{const p=+localStorage.getItem('ph_best')||0;if(sc>p)localStorage.setItem('ph_best',sc)}catch(_){}}
if(e.target.id=='rs')go('test')});

const LQ=[['Explain the Z-scheme of light reaction.','PS II (P680) absorbs light, electron goes through Pheo, QA, PQ, Cyt b6f, PC to PS I (P700). Water splits to refill PS II, releasing O₂, H⁺. PS I electron goes through Fd to NADP reductase making NADPH. H⁺ gradient drives ATP synthase. Add the diagram.'],
['Describe the three stages of the Calvin cycle.','Carboxylation (RuBisCO: RuBP + CO₂ → 3-PGA), Reduction (2 ATP + 2 NADPH → PGAL), Regeneration of RuBP (1 ATP). 3 ATP + 2 NADPH per CO₂; 18 ATP + 12 NADPH per glucose.'],
['Explain the C4 pathway and why it is efficient.','Mesophyll: PEP → OAA (PEPcase). Malate to bundle sheath, releases CO₂ for Calvin cycle. Kranz anatomy, no photorespiration, high CO₂ at RuBisCO. 5 ATP + 2 NADPH per CO₂ but higher yield in heat.'],
['What is photorespiration? Why is it wasteful?','RuBisCO oxygenase adds O₂ to RuBP when CO₂ is low. Path: chloroplast → peroxisome → mitochondria. Releases CO₂, no ATP/NADPH made, lowers yield in C3 plants.'],
['Explain chemiosmotic hypothesis of ATP synthesis.','H⁺ build up in the lumen by water splitting, PQ proton pumping, and NADP reduction taking H⁺ from stroma. Gradient drives H⁺ through CF₀ channel; CF₁ makes ATP from ADP + Pi.'],
['State Blackman\'s law and factors affecting photosynthesis.','Rate is limited by the factor nearest minimum. Light, CO₂, temperature, water; give saturation values and C3/C4 contrast.']];
const TOP=[['Differentiate C3 and C4 plants.',5,'Use the table: first product, anatomy, enzymes, photorespiration, ATP.'],['Draw Z-scheme.',5,'Both photosystems, carriers, ATP and NADPH.'],['Role of RuBisCO.',2,'Carboxylase in Calvin cycle; oxygenase in photorespiration.'],['Kranz anatomy.',2,'Bundle sheath with large chloroplasts around veins.'],['Photolysis of water.',3,'2H₂O → 4H⁺ + O₂ + 4e⁻; Mn, Ca, Cl; lumen side.'],['Cyclic vs non-cyclic photophosphorylation.',3,'Table: PS involved, products, location.'],['Absorption vs action spectrum.',2,'Absorption: light absorbed; action: photosynthesis rate.'],['Engelmann\'s experiment.',3,'Cladophora, prism, aerobic bacteria at blue and red.'],['Why is C4 more efficient?',3,'No photorespiration, PEPcase, Kranz.'],['Chemiosmosis.',3,'Proton gradient, ATP synthase CF₀-CF₁.'],['Photorespiration definition.',2,'RuBisCO binds O₂; C → P → M.'],['Blackman\'s law.',2,'Limiting factor nearest minimum.'],['Accessory pigments.',2,'Chl b, xanthophyll, carotenoid: pass energy, protect.'],['Site of light and dark reactions.',1,'Grana and stroma.'],['Products of light reaction.',1,'ATP, NADPH, O₂.'],['First stable product in C3/C4.',1,'3-PGA / OAA.'],['ATP and NADPH per glucose.',2,'18 ATP + 12 NADPH (C3).'],['Van Niel\'s contribution.',2,'H donor is water; O₂ from water.'],['Why dark reaction is not truly dark?',2,'Needs ATP and NADPH from light.'],['Factors: CO₂ role.',3,'Saturation C3 450, C4 360 µL/L; greenhouse use.']];
const LA=[
`<h3>Full model answer (5 marks)</h3><ul><li><b>Place:</b> thylakoid membranes of grana.</li><li>Light excites <b>PS II (P680)</b>. Electrons go to Pheo, then QA → PQ → Cyt b6f → PC.</li><li>Lost electrons of PS II are replaced by <b>photolysis of water</b> in the lumen: 2H₂O → 4H⁺ + O₂ + 4e⁻.</li><li>PC passes electrons to <b>PS I (P700)</b>. Light excites PS I again; electrons go A0 → A1 → Fd → NADP reductase.</li><li>NADP⁺ + 2e⁻ + H⁺ → <b>NADPH</b>.</li><li>Drawn on a redox-potential axis the path looks like the letter <b>Z</b>.</li><li><b>Products:</b> ATP, NADPH and O₂. <i>Draw the Z-scheme from the Diagrams tab.</i></li></ul>`,
`<h3>Full model answer (5 marks)</h3><ul><li>Occurs in the <b>stroma</b>; uses ATP and NADPH of the light reaction.</li><li><b>Carboxylation:</b> 3 CO₂ + 3 RuBP → 6 × 3-PGA, catalysed by <b>RuBisCO</b>.</li><li><b>Reduction:</b> 6 3-PGA + 6 ATP + 6 NADPH → 6 PGAL.</li><li><b>Regeneration:</b> 5 PGAL are rearranged into 3 RuBP using 3 ATP; 1 PGAL leaves as net gain.</li><li>Per CO₂: <b>3 ATP + 2 NADPH</b>. Per glucose (6 turns): <b>18 ATP + 12 NADPH</b>.</li><li>Sugar made is used for starch, sucrose, amino acids and fats.</li></ul>`,
`<h3>Full model answer (5 marks)</h3><ul><li>Seen in maize, sugarcane, sorghum; leaves have <b>Kranz anatomy</b> (bundle sheath cells with large chloroplasts).</li><li>Mesophyll: PEP (3C) + CO₂ → <b>OAA (4C)</b> by <b>PEPcase</b>. OAA becomes malate / aspartate.</li><li>This 4C acid moves to the bundle sheath and releases CO₂; the 3C pyruvate returns to mesophyll and forms PEP using 2 ATP.</li><li>In the sheath, CO₂ enters the <b>Calvin cycle</b> through RuBisCO.</li><li><b>Efficient because:</b> CO₂ is concentrated around RuBisCO, so there is <b>no photorespiration</b>; PEPcase has no oxygenase action; works well in heat and strong light.</li><li>Cost: 5 ATP + 2 NADPH per CO₂.</li></ul>`,
`<h3>Full model answer (3–5 marks)</h3><ul><li>RuBisCO has both carboxylase and oxygenase action. At <b>high O₂ and low CO₂</b> it adds O₂ to RuBP.</li><li>Products: one 3-PGA and one 2C <b>phosphoglycolate</b>, which becomes glycolate.</li><li>Pathway: <b>chloroplast → peroxisome → mitochondria</b>; CO₂ is released, no ATP or NADPH is made.</li><li><b>Wasteful</b> because fixed energy and carbon are lost; yield falls in C3 plants.</li><li>C4 plants avoid it by concentrating CO₂ in the bundle sheath.</li></ul>`,
`<h3>Full model answer (3–5 marks)</h3><ul><li>Proposed by Peter Mitchell: ATP is made by a <b>proton gradient</b> across the thylakoid membrane.</li><li>H⁺ build up in the <b>lumen</b> from: (1) water splitting, (2) PQ carrying H⁺ from stroma to lumen, (3) NADP reductase using H⁺ from stroma.</li><li>Gradient creates a pH difference and stored energy.</li><li>H⁺ flow back to the stroma through the <b>CF₀ channel</b> of ATP synthase; the <b>CF₁</b> head makes ATP from ADP + Pi.</li><li>Needs intact membrane, proton pumps, and ATP synthase.</li></ul>`,
`<h3>Full model answer (3–5 marks)</h3><ul><li><b>Blackman (1905):</b> when a process depends on several factors, the rate is controlled by the factor <b>nearest its minimum value</b>.</li><li><b>Light:</b> rate rises, then saturates (about 10% of full sunlight); very high light damages chlorophyll.</li><li><b>CO₂:</b> major limiting factor. C3 saturates near <b>450 µL/L</b>, C4 near 360; extra CO₂ benefits only C3.</li><li><b>Temperature:</b> controls enzymes; C4 optimum higher than C3.</li><li><b>Water:</b> stress closes stomata, cutting CO₂ and wilting leaves.</li></ul>`];
const LONG=[C('<h2>Long-answer questions</h2><p class="ex">Tap a question: you get the quick outline first, then the full model answer.</p>','o'),...LQ.map((q,i)=>D(q[0],`<h3>Quick outline</h3><p>${q[1]}</p>`+LA[i]))];

const ar='<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#ffc933"/></marker></defs>';
const grana=(x,y)=>[0,1,2,3].map(i=>`<rect x="${x}" y="${y+i*9}" width="44" height="6" rx="3" fill="#b8f23a"/>`).join('');
const DG=[C('<h2>2D diagrams</h2><p class="ex">Practise drawing each one in 2 minutes. Examiners reward neat labels and arrows.</p>','k'),Z,
C(`<h3>Chloroplast (labelled)</h3><svg class="dg" viewBox="0 0 360 210" role="img" aria-label="Chloroplast"><ellipse cx="180" cy="100" rx="160" ry="78" fill="#1f5a3a" stroke="#b8f23a" stroke-width="3"/><ellipse cx="180" cy="100" rx="148" ry="67" fill="none" stroke="#ffc933" stroke-width="2"/>${grana(70,75)}${grana(160,90)}${grana(250,72)}<path d="M114 95 L160 108 M204 110 L250 92" stroke="#3dd6ff" stroke-width="3"/><text x="8" y="14">Outer + inner membrane</text><text x="40" y="190">Granum (stack of thylakoids): LIGHT reaction</text><text x="8" y="30" fill="#ffc933">Stroma: CALVIN cycle (enzymes, DNA, ribosomes)</text><text x="200" y="145" fill="#3dd6ff">Stroma lamella</text><text x="270" y="170">Lumen = inside each thylakoid</text></svg>`,'s'),
C(`<h3>Calvin cycle (3 stages)</h3><svg class="dg" viewBox="0 0 360 250" role="img" aria-label="Calvin cycle">${ar}<rect x="95" y="8" width="170" height="44" rx="10" fill="#9a82ff" opacity=".4"/><text x="104" y="26">1 Carboxylation: CO₂ + RuBP</text><text x="104" y="42">→ 2 × 3-PGA (RuBisCO)</text><rect x="215" y="170" width="140" height="50" rx="10" fill="#ff6b57" opacity=".4"/><text x="222" y="188">2 Reduction: 3-PGA →</text><text x="222" y="204">PGAL (2 ATP, 2 NADPH)</text><rect x="5" y="170" width="140" height="50" rx="10" fill="#3dd6ff" opacity=".4"/><text x="12" y="188">3 Regeneration of RuBP</text><text x="12" y="204">(uses 1 ATP)</text><path d="M240 54 Q320 90 290 166" fill="none" stroke="#ffc933" stroke-width="2.5" marker-end="url(#ar)"/><path d="M212 196 L150 196" stroke="#ffc933" stroke-width="2.5" marker-end="url(#ar)"/><path d="M70 166 Q40 90 120 56" fill="none" stroke="#ffc933" stroke-width="2.5" marker-end="url(#ar)"/><text x="130" y="240">1 PGAL out → glucose, starch</text></svg>`),
C(`<h3>C4 leaf: Kranz anatomy</h3><svg class="dg" viewBox="0 0 360 240" role="img" aria-label="Kranz anatomy">${ar}<circle cx="180" cy="120" r="105" fill="#1f5a3a" stroke="#b8f23a" stroke-width="3"/><circle cx="180" cy="120" r="58" fill="#3dd6ff33" stroke="#ffc933" stroke-width="3"/><circle cx="180" cy="120" r="22" fill="#9a82ff" opacity=".6"/>${[0,1,2,3,4,5,6,7].map(i=>`<circle cx="${180+46*Math.cos(i*.785)}" cy="${120+46*Math.sin(i*.785)}" r="6" fill="#b8f23a"/>`).join('')}<text x="160" y="124">Vein</text><text x="140" y="190" fill="#ffc933">Bundle sheath: CO₂ → Calvin</text><text x="108" y="30">Mesophyll: PEP + CO₂ → OAA</text><path d="M120 40 Q95 120 130 150" fill="none" stroke="#ffc933" stroke-width="2.5" marker-end="url(#ar)"/><text x="4" y="120">Malate →</text><text x="268" y="120">← Pyruvate</text></svg>`,'v'),
C(`<h3>Light intensity vs photosynthesis rate</h3><svg class="dg" viewBox="0 0 360 220" role="img" aria-label="Rate graph"><path d="M40 10 V180 H340" stroke="#a9c7b4" fill="none" stroke-width="2"/><path d="M40 180 Q90 60 150 52 L330 50" fill="none" stroke="#b8f23a" stroke-width="3.5"/><path d="M150 52 V180" stroke="#ffc933" stroke-dasharray="5 4"/><text x="45" y="200">Light intensity →</text><text x="2" y="14">Rate ↑</text><text x="52" y="120" fill="#ff6b57">Light is limiting</text><text x="160" y="40" fill="#ffc933">Saturation: another factor limits</text><text x="156" y="170">~10% full sunlight</text></svg>`,'o')];
const TOPV=[C('<h2>Top 20 repeated exam questions</h2><p class="ex">These are the most commonly repeated question types in school exams on this chapter, grouped by pattern (not copied from any single paper). Tap for the key points.</p>','s'),...TOP.map((q,i)=>D(`${i+1}. ${q[0]} <small>(${q[1]}m)</small>`,`<p>${q[2]}</p>`,'k'))];

const TABS={learn:['📘 Learn',()=>'<h2>Theory in simple words</h2>'+LEARN.join('')],flow:['🔀 Flowcharts',()=>FLOWS.join('')],dg:['🎨 Diagrams',()=>DG.join('')],mn:['🧠 Mnemonics',()=>MN.join('')],facts:['⚡ Facts &amp; Hacks',()=>FACTS.join('')],real:['🌱 Real life',()=>REAL.join('')],test:['📝 Mock test',TEST],lq:['✍️ Long Q',()=>LONG.join('')],top:['🏆 Top 20',()=>TOPV.join('')]};
